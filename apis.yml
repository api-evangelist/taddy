aid: taddy
url: https://raw.githubusercontent.com/api-evangelist/taddy/refs/heads/main/apis.yml
name: Taddy
kind: company
description: Taddy is a GraphQL API for podcasts and comics, giving developers access
  to over 4 million podcasts and 200 million episodes, plus real-time full-text
  search, automatically generated episode transcripts, chapters, iTunes metadata,
  daily top charts, webcomic and creator data, and webhook notifications for new or
  updated content. All queries hit a single GraphQL endpoint at https://api.taddy.org
  authenticated with X-USER-ID and X-API-KEY headers.
