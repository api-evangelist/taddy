meters:
- name: api_requests
  description: GraphQL API requests against https://api.taddy.org, bounded by the monthly plan quota.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
- name: transcript_credits
  description: Episode transcripts generated/retrieved, drawn from the monthly transcript credit allotment.
  unit: transcripts
  aggregation: sum
  dimensions:
  - account
  - plan
- name: subscription_fee
  description: Flat monthly plan subscription fee (Pro $75, Business $150).
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: addon_transcript_packs
  description: Additional 3,000-transcript credit packs purchased at $75/mo each.
  unit: packs
  aggregation: sum
  dimensions:
  - account
- name: addon_request_volume
  description: Higher monthly request-volume add-ons (e.g. 1M requests for $250/mo).
  unit: requests
  aggregation: sum
  dimensions:
  - account
focusColumns:
