principles:
- name: Visibility
  description: Track getApiRequestsRemaining and getTranscriptCreditsRemaining to watch monthly quota burn.
- name: Allocation
  description: Issue separate API keys per app/workload to attribute request and transcript consumption.
- name: Optimization
  description: Batch lookups with getMultiplePodcastSeries/getMultiplePodcastEpisodes; cache stored results (Taddy permits caching) to avoid re-querying; only transcribe episodes you need.
- name: Accountability
  description: Match plan tier to monthly request/transcript demand; buy add-on packs only when consistently exceeding included credits.
