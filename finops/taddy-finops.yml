description: >-
  FinOps view of Taddy spend. Taddy bills a flat monthly subscription per plan
  (Free $0, Pro $75, Business $150) that bundles a monthly API request quota and
  a monthly episode-transcript credit allotment. Overages are handled by
  upgrading tiers or buying add-ons: extra transcripts in 3,000-credit packs at
  $75/mo and higher request volumes (e.g. 1M requests for $250/mo). The two
  cost-driving meters are GraphQL API requests and generated episode
  transcripts.
notes: >-
  Subscription-plus-quota model rather than pure pay-as-you-go; the marginal
  cost of an API request or transcript is effectively the blended plan/add-on
  rate. Verify current prices on the Taddy pricing page during reconciliation.
sources:
- https://taddy.org/developers/pricing
